version: '3.8'

services:
  renewsense:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data/cache:/app/data/cache    # Persist disk cache
      - ./exports:/app/exports          # Persist generated reports
    restart: unless-stopped
    depends_on:
      - redis
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
